<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyByte</title>
    <meta name="description" content="nutrition information for your food"
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
</head>
<body>
    <header>

    </header>

    <nav>
        <a href="">Sign In</a>
        <a href="">Sign Up</a>
    </nav>

    <button id="scan-button">Scan</button>
    
    <div id="scanner-container" style="display: none;">
        <div id="interactive" class="viewport"></div>
    </div>

    <div id="result"></div>

    <form method="POST">
        <input type="text" name="barcode_number" placeholder="Enter barcode manually">
        <button type="submit">Search</button>
    </form>

    {% if nutrition_info %}
        <div>Nutrition Info: {{ nutrition_info }}</div>
    {% elif error %}
        <div>{{ error }}</div>
    {% endif %}

    <footer>

    </footer>
    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>
</html>
