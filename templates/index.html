{% extends "base.html" %}

{% block content %}
<main>
    <h3>MyByte</h3>
    <form action="{{ url_for('get_barcode') }}" method="POST">
        <label for="barcode">Barcode number</label>
        <input type="text" id="barcode" name="barcode" required>
        <button type="submit">Submit</button>
    </form>
    <div>
        {% if nutrition_info %}
            {{ nutrition_info }}
        {% endif %}
    </div>
</main>
{% endblock %}
